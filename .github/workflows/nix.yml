name: Nix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/nix.yml"
      - "assets/**"
      - "build.rs"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.lock"
      - "flake.nix"
      - "nix/**"
      - "skills/**"
      - "vendor/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/nix.yml"
      - "assets/**"
      - "build.rs"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.lock"
      - "flake.nix"
      - "nix/**"
      - "skills/**"
      - "vendor/**"

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_only: ${{ steps.diff.outputs.version_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2
          persist-credentials: false

      # A pull request checks out its merge commit, whose first parent is the
      # base branch tip.
      - name: Detect a version-only change
        id: diff
        run: echo "version_only=$(python3 scripts/version_bump_only.py HEAD^1 HEAD)" >> "$GITHUB_OUTPUT"

  flake-check:
    name: flake check
    # Not plain `needs`: a failed detection must not skip the checks. Pushes
    # still run so master saves the caches keyed on the new Cargo.lock.
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.version_only != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Run Nix flake check
        run: |
          nix flake check --print-build-logs
          nix flake check --all-systems --no-build --print-build-logs
